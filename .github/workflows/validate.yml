name: Validate Reelhouse

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile backend/main.py backend/moviebox_internal.py api/index.py scripts/import_scrapper.py scripts/import_kaggle_tmdb.py
