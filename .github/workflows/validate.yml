name: Validate Reelhouse

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/vidsrc_stream.py

  vidsrc-live-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base_url: https://vidsrc.sh
            host: vidsrc.sh
          - base_url: https://vidsrc2.ru
            host: vidsrc2.ru
          - base_url: https://vidsrc.ir
            host: vidsrc.ir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scraper runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Extract one authorized VidSrc movie stream
        run: |
          rm -f /tmp/vidsrc-streams.json
          python scripts/vidsrc_stream.py             --media-key movie:68721             --base-url ${{ matrix.base_url }}             --allowed-host ${{ matrix.host }}             --allow-discovered-media-hosts             --timeout-ms 45000             --streams-file /tmp/vidsrc-streams.json
      - name: Validate discovered media
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          data = json.loads(Path("/tmp/vidsrc-streams.json").read_text())
          source = data.get("movie:68721")
          if not isinstance(source, dict) or not source.get("url"):
              raise SystemExit("No playable media URL was discovered")

          url = source["url"]
          headers = {}
          if source.get("referer"):
              headers["Referer"] = source["referer"]
          if source.get("userAgent"):
              headers["User-Agent"] = source["userAgent"]

          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=20) as response:
              status = response.status
              content_type = response.headers.get("content-type", "")
              sample = response.read(4096)

          print(f"status={status}")
          print(f"content-type={content_type}")
          print(f"url={url}")
          if not (200 <= status < 400):
              raise SystemExit(f"Media endpoint returned HTTP {status}")

          if source.get("type") == "hls" and b"#EXTM3U" not in sample:
              raise SystemExit("Discovered HLS URL did not return an HLS playlist")

          print("VidSrc live smoke test: POSITIVE")
          PY
