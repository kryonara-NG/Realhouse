name: Build Reelhouse Android APK\n\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\njobs:\n  apk:\n    runs-on: ubuntu-latest\n    env:\n      REELHOUSE_KEYSTORE_B64: ${{ secrets.REELHOUSE_KEYSTORE_B64 }}\n      REELHOUSE_KEYSTORE_PASSWORD: ${{ secrets.REELHOUSE_KEYSTORE_PASSWORD }}\n      REELHOUSE_KEY_ALIAS: ${{ secrets.REELHOUSE_KEY_ALIAS }}\n      REELHOUSE_KEY_PASSWORD: ${{ secrets.REELHOUSE_KEY_PASSWORD }}\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 18\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '17'\n      - name: Install and build web app\n        run: |\n          npm install\n          npm run build\n      - name: Add Android platform\n        run: npx cap add android\n      - name: Sync Capacitor\n        run: npx cap sync android\n      - name: Set Android version\n        run: |\n          python - <<'PY'\n          from pathlib import Path\n          p=Path('android/app/build.gradle')\n          s=p.read_text()\n          s=s.replace('versionCode 1', 'versionCode ${{ github.run_number }}')\n          s=s.replace('versionName "1.0"', 'versionName "1.0.${{ github.run_number }}"')\n          p.write_text(s)\n          PY\n      - name: Configure release signing\n        run: |\n          test -n "$REELHOUSE_KEYSTORE_B64" || (echo "Missing REELHOUSE_KEYSTORE_B64" && exit 1)\n          test -n "$REELHOUSE_KEYSTORE_PASSWORD" || (echo "Missing REELHOUSE_KEYSTORE_PASSWORD" && exit 1)\n          test -n "$REELHOUSE_KEY_ALIAS" || (echo "Missing REELHOUSE_KEY_ALIAS" && exit 1)\n          test -n "$REELHOUSE_KEY_PASSWORD" || (echo "Missing REELHOUSE_KEY_PASSWORD" && exit 1)\n          echo "$REELHOUSE_KEYSTORE_B64" | base64 --decode > android/reelhouse-release.jks\n          cat >> android/app/build.gradle <<'GRADLE'\n\n          android {\n            signingConfigs {\n              release {\n                storeFile file("../reelhouse-release.jks")\n                storePassword System.getenv("REELHOUSE_KEYSTORE_PASSWORD")\n                keyAlias System.getenv("REELHOUSE_KEY_ALIAS")\n                keyPassword System.getenv("REELHOUSE_KEY_PASSWORD")\n              }\n            }\n            buildTypes {\n              release {\n                signingConfig signingConfigs.release\n              }\n            }\n          }\n          GRADLE\n      - name: Build signed APK\n        working-directory: android\n        run: ./gradlew assembleRelease --no-daemon\n      - name: Publish latest APK\n        uses: softprops/action-gh-release@v2\n        with:\n          tag_name: latest\n          name: Reelhouse latest\n          prerelease: false\n          make_latest: true\n          files: android/app/build/outputs/apk/release/app-release.apk\n          body: |\n            Automatically built from main.\n            Version code: ${{ github.run_number }}\n            The stable download URL always points to this latest APK.\n