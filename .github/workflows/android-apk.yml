name: Build Reelhouse Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and build web app
        run: |
          npm install
          npm run build

      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 1", "versionCode ${{ github.run_number }}")
          s = s.replace('versionName "1.0"', 'versionName "1.0.${{ github.run_number }}"')
          p.write_text(s)
          PY

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Reelhouse.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Reelhouse latest
          prerelease: false
          make_latest: true
          files: Reelhouse.apk
          body: |
            Automatically built from main.
            Version code: ${{ github.run_number }}
            Debug-signed installable APK for direct Android installation.
